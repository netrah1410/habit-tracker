<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="manifest" href="manifest.json">
<title>Daily Habit Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--yes:#1f8a4c;--no:#c93b3b;--ac:#2f5fd0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--tx:#efeee9;--mu:#a09f98;--bd:#383836;--yes:#3fbf78;--no:#ef6b6b;--ac:#7a9cf0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.sub,.tag{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.score{display:flex;gap:12px}.score div{flex:1}
.big{font-size:28px;font-weight:700}
.pos{color:var(--yes)}.neg{color:var(--no)}
.row{padding:10px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.name{margin-bottom:8px;font-weight:600}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:12px 0;border-radius:10px;border:1.5px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-weight:600}
.btns button.on.Y{background:var(--yes);border-color:var(--yes);color:#fff}
.btns button.on.N{background:var(--no);border-color:var(--no);color:#fff}
.btns button.on.NA{background:var(--mu);border-color:var(--mu);color:#fff}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button,.link{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-top:1px solid var(--bd);text-align:left}
th{color:var(--mu);font-weight:500;border-top:0}
td:last-child,th:last-child{text-align:right}
.wrap{overflow-x:auto}
#msg{color:var(--no);font-size:14px;min-height:18px}
</style>
</head>
<body>
<main>
  <h1>Daily Habit Tracker</h1>
  <div class="sub" id="date"></div>
  <div class="tabs">
    <button id="t1">Today</button><button id="t2">History</button><button id="t3">⚙</button>
  </div>
  <div id="msg"></div>
  <div id="view"></div>
</main>
<script>
const P = v => v === "Y" ? 20 : v === "N" ? -20 : 0;
const $ = id => document.getElementById(id);
const MN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtMonth = k => { const [y,m] = k.split("-").map(Number); return MN[m-1] + " " + y; };
const fmtDate = s => { const [y,m,d] = s.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"}); };
const sg = n => (n > 0 ? "+" : "") + n;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let cfg = null, S = null, tab = 1, editing = false, msg = "";
try { cfg = JSON.parse(localStorage.getItem("ht-cfg")); } catch (e) {}

async function api(body){
  const r = await fetch(cfg.url, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(Object.assign({token: cfg.token}, body))
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function refresh(){
  if (!cfg) return render();
  try { S = await api({action:"state"}); msg = ""; }
  catch (e) { msg = "Could not sync: " + e.message; }
  render();
}

async function answer(i, v){
  const old = S.answers[i];
  if (old === v) return;
  const d = P(v) - P(old);
  S.answers[i] = v; S.dayTotal += d; S.monthTotal += d; render();
  try { S = await api({action:"answer", i, v}); msg = ""; }
  catch (e) { S.answers[i] = old; S.dayTotal -= d; S.monthTotal -= d; msg = "Not saved. Check your connection."; }
  render();
}

async function rename(i, name){
  try { S = await api({action:"rename", i, name}); msg = ""; }
  catch (e) { msg = "Rename failed: " + e.message; }
  render();
}

function render(){
  [1,2,3].forEach(n => $("t"+n).className = tab === n ? "on" : "");
  $("msg").textContent = msg;
  const v = $("view");
  if (!cfg || tab === 3){
    v.innerHTML = `<div class="card"><div class="name">Connect to your Google Sheet</div>
      <label class="tag">Web app URL</label><input id="u" value="${esc(cfg ? cfg.url : "")}" placeholder="https://script.google.com/.../exec">
      <label class="tag">Secret token</label><input id="k" type="password" value="${esc(cfg ? cfg.token : "")}">
      <button class="link" id="save">Save and connect</button></div>`;
    $("save").onclick = () => {
      cfg = {url: $("u").value.trim(), token: $("k").value.trim()};
      try { localStorage.setItem("ht-cfg", JSON.stringify(cfg)); } catch (e) {}
      tab = 1; refresh();
    };
    return;
  }
  if (!S){ v.innerHTML = '<p class="sub">Loading…</p>'; return; }
  $("date").textContent = fmtDate(S.today);
  if (tab === 1){
    let h = `<div class="card score">
      <div><div class="tag">${fmtMonth(S.monthKey)} total</div><div class="big ${S.monthTotal<0?"neg":"pos"}">${sg(S.monthTotal)}</div></div>
      <div><div class="tag">Today so far</div><div class="big ${S.dayTotal<0?"neg":"pos"}">${sg(S.dayTotal)}</div></div></div><div class="card">`;
    S.habits.forEach((name,i) => {
      const x = S.answers[i];
      h += `<div class="row"><div class="name">${editing ? `<input data-i="${i}" value="${esc(name)}" maxlength="100">` : esc(name)}</div>
        <div class="btns">
          <button class="Y ${x==="Y"?"on":""}" data-i="${i}" data-v="Y">Yes +20</button>
          <button class="N ${x==="N"?"on":""}" data-i="${i}" data-v="N">No −20</button>
          <button class="NA ${x==="NA"?"on":""}" data-i="${i}" data-v="NA">NA 0</button>
        </div></div>`;
    });
    h += `</div><button class="link" id="edit">${editing ? "Done editing names" : "Edit habit names"}</button>
      <p class="sub">You can change today’s answers until midnight. Anything left blank at the end of the day becomes No (−20). Past dates are locked.</p>`;
    v.innerHTML = h;
    v.querySelectorAll(".btns button").forEach(b => b.onclick = () => answer(+b.dataset.i, b.dataset.v));
    v.querySelectorAll("input").forEach(inp => inp.onchange = () => rename(+inp.dataset.i, inp.value.trim()));
    $("edit").onclick = () => { editing = !editing; render(); };
  } else {
    let h = `<div class="card"><div class="name">Monthly totals</div><div class="wrap"><table><tr><th>Month</th><th>Status</th><th>Points</th></tr>`;
    S.months.forEach(m => h += `<tr><td>${fmtMonth(m.m)}</td><td>${m.closed?"Closed":"Running"}</td><td class="${m.p<0?"neg":"pos"}">${sg(m.p)}</td></tr>`);
    h += `</table></div></div><div class="card"><div class="name">Daily log</div><div class="wrap"><table><tr><th>Date</th><th>Yes</th><th>No</th><th>NA</th><th>Points</th></tr>`;
    S.log.forEach(r => h += `<tr><td>${r.d}</td><td>${r.y}</td><td>${r.n}</td><td>${r.na}</td><td class="${r.p<0?"neg":"pos"}">${sg(r.p)}</td></tr>`);
    v.innerHTML = h + `</table></div></div>`;
  }
}

$("t1").onclick = () => { tab = 1; render(); };
$("t2").onclick = () => { tab = 2; render(); };
$("t3").onclick = () => { tab = 3; render(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
render(); refresh();
</script>
</body>
</html>
